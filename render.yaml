# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: my-travel
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Values below are entered in the Render dashboard, never committed.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AERODATABOX_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
